# Dataset-to-Odor Mapping Template for CCBPN Training
# ======================================================
#
# This file maps dataset names and trial labels to actual odor identities.
# CRITICAL: Fill in this template with YOUR experimental design before training!
#
# Structure:
#   dataset_name:
#     training_trials: [list of odors presented during training, in order]
#     testing_trials: [list of odors presented during testing, in order]
#
# Available odors (from your experiments):
#   - hexanol
#   - ethyl_butyrate
#   - benzaldehyde
#   - 3-octanol
#   - citral
#   - linalool
#   - apple_cider_vinegar
#
# INSTRUCTIONS:
# 1. For each dataset in model_predictions.csv, specify which odors were used
# 2. Training trials: Usually the same odor repeated (CS+ conditioning)
# 3. Testing trials: Mix of CS+ (trained odor) and CS- (novel odors)
# 4. Order matters! Trial 1 = first odor in list, trial 2 = second odor, etc.
#
# Example (REPLACE WITH YOUR ACTUAL EXPERIMENTAL DESIGN):

# Benzaldehyde control experiment
Benz_control:
  # Training phase: Flies trained to associate benzaldehyde with reward
  training_trials:
    - benzaldehyde  # training_1
    - benzaldehyde  # training_2
    - benzaldehyde  # training_3
    - benzaldehyde  # training_4
    - benzaldehyde  # training_5
    # ... add more if you had more training trials

  # Testing phase: Test discrimination (benzaldehyde vs. novel odors)
  testing_trials:
    - benzaldehyde  # testing_1: CS+ (should approach)
    - 3-octanol     # testing_2: CS- (should avoid)
    - benzaldehyde  # testing_3: CS+ again
    - hexanol       # testing_4: CS- (different novel odor)
    # ... fill in complete test sequence

# Hexanol control experiment
hex_control:
  training_trials:
    - hexanol  # REPLACE with your actual training sequence
    - hexanol
    - hexanol

  testing_trials:
    - hexanol         # REPLACE with your actual test sequence
    - ethyl_butyrate  # Example CS-
    - hexanol
    # ... continue

# Ethyl butyrate control experiment
EB_control:
  training_trials:
    - ethyl_butyrate  # REPLACE with actual sequence
    - ethyl_butyrate

  testing_trials:
    - ethyl_butyrate  # REPLACE with actual sequence
    - benzaldehyde    # Example CS-
    # ... continue

