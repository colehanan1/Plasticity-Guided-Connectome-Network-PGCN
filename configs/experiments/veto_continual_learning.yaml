# ==============================================================================
# NOTES
# ==============================================================================

notes: |
  Configuration for Or7a-inspired selective veto gate continual learning.

  Key design principles:
  1. Chemical similarity (DoOR) predicts interference
  2. Graded protection (not binary on/off)
  3. Dynamic pathway identification (not fixed like Or7a)
  4. Minimal overhead (top 30% protection sufficient)

  Expected outcomes:
  - Baseline: 40% forgetting (catastrophic)
  - Veto gate: <5% forgetting (excellent retention)
  - Simplified EWC: 10-20% forgetting (moderate)
  - Freeze top-k: 15-25% forgetting (partial protection)

  Biological validation:
  - Veto strength ~0.9 matches Or7a blocking strength (55% activation)
  - Protection threshold 0.3 matches sparse coding (~30% critical neurons)
  - Min gating 0.1 prevents full plasticity shutdown (biologically realistic)
