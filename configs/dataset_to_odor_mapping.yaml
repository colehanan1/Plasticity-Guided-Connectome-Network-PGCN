# Dataset-to-Odor Mapping for CCBPN Training
# ==============================================
#
# This file maps dataset names and trial numbers to actual odor identities
# based on the experimental design provided by the user.
#
# Experimental Design:
# - Training trials 1,2,3,4,6,8: Main CS+ odor (30s presentation, 5min ITI)
# - Training trials 5,7: Different odor (blocking paradigm)
# - Testing trials: Mix of CS+, CS-, and novel odors (5min ITI)
# - 30 minutes between training and testing phases
#
# Available odors in DoOR:
#   hexanol, ethyl_butyrate, benzaldehyde, 3-octanol, citral, linalool
#   (apple_cider_vinegar may not be in DoOR - will use approximation)

# ============================================================================
# Benzaldehyde Control Experiment
# ============================================================================
Benz_control:
  training_trials:
    - benzaldehyde  # training_1: CS+
    - benzaldehyde  # training_2: CS+
    - benzaldehyde  # training_3: CS+
    - benzaldehyde  # training_4: CS+
    - hexanol       # training_5: CS- (blocking)
    - benzaldehyde  # training_6: CS+
    - hexanol       # training_7: CS- (blocking)
    - benzaldehyde  # training_8: CS+

  testing_trials:
    - hexanol                # testing_1: CS- from training
    - benzaldehyde           # testing_2: CS+ test
    - hexanol                # testing_3: CS- from training
    - benzaldehyde           # testing_4: CS+ test
    - benzaldehyde           # testing_5: CS+ test
    - apple_cider_vinegar    # testing_6: novel odor
    - 3-octanol              # testing_7: novel odor
    - ethyl_butyrate         # testing_8: novel odor
    - citral                 # testing_9: novel odor
    - citral                 # testing_10: novel odor (repeat)

# ============================================================================
# Optogenetic + Benzaldehyde Experiment
# ============================================================================
opto_benz_1:
  training_trials:
    - benzaldehyde  # training_1: CS+ with GR5a activation
    - benzaldehyde  # training_2: CS+
    - benzaldehyde  # training_3: CS+
    - benzaldehyde  # training_4: CS+
    - hexanol       # training_5: CS- (blocking)
    - benzaldehyde  # training_6: CS+
    - hexanol       # training_7: CS- (blocking)
    - benzaldehyde  # training_8: CS+

  testing_trials:
    - hexanol                # testing_1: CS- from training
    - benzaldehyde           # testing_2: CS+ test
    - hexanol                # testing_3: CS- from training
    - benzaldehyde           # testing_4: CS+ test
    - benzaldehyde           # testing_5: CS+ test
    - apple_cider_vinegar    # testing_6: novel odor
    - 3-octanol              # testing_7: novel odor
    - ethyl_butyrate         # testing_8: novel odor
    - citral                 # testing_9: novel odor
    - citral                 # testing_10: novel odor (repeat)

# ============================================================================
# Ethyl Butyrate Control Experiment
# ============================================================================
EB_control:
  training_trials:
    - ethyl_butyrate  # training_1: CS+
    - ethyl_butyrate  # training_2: CS+
    - ethyl_butyrate  # training_3: CS+
    - ethyl_butyrate  # training_4: CS+
    - hexanol         # training_5: CS- (blocking)
    - ethyl_butyrate  # training_6: CS+
    - hexanol         # training_7: CS- (blocking)
    - ethyl_butyrate  # training_8: CS+

  testing_trials:
    - hexanol          # testing_1: CS- from training
    - ethyl_butyrate   # testing_2: CS+ test
    - hexanol          # testing_3: CS- from training
    - ethyl_butyrate   # testing_4: CS+ test
    - ethyl_butyrate   # testing_5: CS+ test
    - apple_cider_vinegar  # testing_6: novel odor
    - 3-octanol        # testing_7: novel odor
    - benzaldehyde     # testing_8: novel odor
    - citral           # testing_9: novel odor
    - linalool         # testing_10: novel odor

# ============================================================================
# Optogenetic + Ethyl Butyrate Experiment
# ============================================================================
opto_EB:
  training_trials:
    - ethyl_butyrate  # training_1: CS+ with GR5a activation
    - ethyl_butyrate  # training_2: CS+
    - ethyl_butyrate  # training_3: CS+
    - ethyl_butyrate  # training_4: CS+
    - hexanol         # training_5: CS- (blocking)
    - ethyl_butyrate  # training_6: CS+
    - hexanol         # training_7: CS- (blocking)
    - ethyl_butyrate  # training_8: CS+

  testing_trials:
    - hexanol          # testing_1: CS- from training
    - ethyl_butyrate   # testing_2: CS+ test
    - hexanol          # testing_3: CS- from training
    - ethyl_butyrate   # testing_4: CS+ test
    - ethyl_butyrate   # testing_5: CS+ test
    - apple_cider_vinegar  # testing_6: novel odor
    - 3-octanol        # testing_7: novel odor
    - benzaldehyde     # testing_8: novel odor
    - citral           # testing_9: novel odor
    - linalool         # testing_10: novel odor

# ============================================================================
# Hexanol Control Experiment
# ============================================================================
hex_control:
  training_trials:
    - hexanol                # training_1: CS+
    - hexanol                # training_2: CS+
    - hexanol                # training_3: CS+
    - hexanol                # training_4: CS+
    - apple_cider_vinegar    # training_5: CS- (blocking)
    - hexanol                # training_6: CS+
    - apple_cider_vinegar    # training_7: CS- (blocking)
    - hexanol                # training_8: CS+

  testing_trials:
    - apple_cider_vinegar    # testing_1: CS- from training
    - hexanol                # testing_2: CS+ test
    - apple_cider_vinegar    # testing_3: CS- from training
    - hexanol                # testing_4: CS+ test
    - hexanol                # testing_5: CS+ test
    - benzaldehyde           # testing_6: novel odor
    - 3-octanol              # testing_7: novel odor
    - ethyl_butyrate         # testing_8: novel odor
    - citral                 # testing_9: novel odor
    - linalool               # testing_10: novel odor

# ============================================================================
# Optogenetic + Hexanol Experiment
# ============================================================================
opto_hex:
  training_trials:
    - hexanol                # training_1: CS+ with GR5a activation
    - hexanol                # training_2: CS+
    - hexanol                # training_3: CS+
    - hexanol                # training_4: CS+
    - apple_cider_vinegar    # training_5: CS- (blocking)
    - hexanol                # training_6: CS+
    - apple_cider_vinegar    # training_7: CS- (blocking)
    - hexanol                # training_8: CS+

  testing_trials:
    - apple_cider_vinegar    # testing_1: CS- from training
    - hexanol                # testing_2: CS+ test
    - apple_cider_vinegar    # testing_3: CS- from training
    - hexanol                # testing_4: CS+ test
    - hexanol                # testing_5: CS+ test
    - benzaldehyde           # testing_6: novel odor
    - 3-octanol              # testing_7: novel odor
    - ethyl_butyrate         # testing_8: novel odor
    - citral                 # testing_9: novel odor
    - linalool               # testing_10: novel odor

# ============================================================================
# Optogenetic + Air Control Experiment (No Odor Conditioning)
# ============================================================================
opto_AIR:
  training_trials:
    # 7 air trials + 1 hexanol trial (control for optogenetic stimulation alone)
    - air          # training_1: air only (no odor)
    - air          # training_2: air only
    - air          # training_3: air only
    - air          # training_4: air only
    - hexanol      # training_5: hexanol (blocking)
    - air          # training_6: air only
    - hexanol      # training_7: hexanol (blocking)
    - air          # training_8: air only

  testing_trials:
    # Testing with various odors to see if optogenetic stimulation alone creates learning
    - hexanol                # testing_1: odor from training
    - air                    # testing_2: air control
    - hexanol                # testing_3: odor from training
    - air                    # testing_4: air control
    - air                    # testing_5: air control
    - apple_cider_vinegar    # testing_6: novel odor
    - ethyl_butyrate         # testing_7: novel odor
    - benzaldehyde           # testing_8: novel odor
    - citral                 # testing_9: novel odor
    - 3-octanol              # testing_10: novel odor

# ============================================================================
# Notes:
# ============================================================================
# 1. Odor names must match DoOR database (lowercase, underscores)
# 2. Special odor name 'air' = no odor (returns zero PN activity, used in control trials)
# 3. apple_cider_vinegar may not be in DoOR - will use acetic acid approximation
# 4. 30s odor presentation during training
# 5. 5 min inter-trial interval (ITI) for both training and testing
# 6. 30 min interval between training and testing phases
# 7. GR5a optogenetic activation in opto_* experiments
# 8. opto_AIR: Control for optogenetic stimulation alone (no odor conditioning)

