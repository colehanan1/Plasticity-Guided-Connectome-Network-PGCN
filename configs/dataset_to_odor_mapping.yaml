# Dataset-to-Odor Mapping for CCBPN Training
# ==============================================
#
# This file maps dataset names and trial numbers to actual odor identities
# based on the experimental design provided by the user.
#
# Experimental Design:
# - Training trials 1,2,3,4,6,8: Main CS+ odor (30s presentation, 5min ITI)
# - Training trials 5,7: Different odor (blocking paradigm)
# - Testing trials: TO BE FILLED IN (waiting for user input)
#
# Available odors in DoOR:
#   hexanol, ethyl_butyrate, benzaldehyde, 3-octanol, citral, linalool
#   (apple_cider_vinegar may not be in DoOR - will use approximation)

# ============================================================================
# Benzaldehyde Control Experiment
# ============================================================================
Benz_control:
  training_trials:
    - benzaldehyde  # training_1: CS+
    - benzaldehyde  # training_2: CS+
    - benzaldehyde  # training_3: CS+
    - benzaldehyde  # training_4: CS+
    - hexanol       # training_5: CS- (different odor)
    - benzaldehyde  # training_6: CS+
    - hexanol       # training_7: CS- (different odor)
    - benzaldehyde  # training_8: CS+

  testing_trials:
    # FILL IN: User needs to provide testing trial odor sequence
    # Example possibilities:
    # - All benzaldehyde (test CS+ only)
    # - Mix of benzaldehyde and hexanol (test discrimination)
    # - Mix of benzaldehyde and novel odors (test generalization)
    - FILL_IN_TESTING_1
    - FILL_IN_TESTING_2
    - FILL_IN_TESTING_3
    - FILL_IN_TESTING_4
    # Add more as needed based on actual number of testing trials

# ============================================================================
# Optogenetic + Benzaldehyde Experiment
# ============================================================================
opto_benz_1:  # Note: User said "opto_benz_1", check if dataset name is exact
  training_trials:
    - benzaldehyde  # training_1: CS+ with GR5a activation
    - benzaldehyde  # training_2: CS+
    - benzaldehyde  # training_3: CS+
    - benzaldehyde  # training_4: CS+
    - hexanol       # training_5: CS-
    - benzaldehyde  # training_6: CS+
    - hexanol       # training_7: CS-
    - benzaldehyde  # training_8: CS+

  testing_trials:
    - FILL_IN_TESTING_1
    - FILL_IN_TESTING_2
    # Fill in based on actual testing protocol

